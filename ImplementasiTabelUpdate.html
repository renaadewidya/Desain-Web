<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementasi Tabel HTML</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .table-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
            overflow-x: auto;
 
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            overflow: hidden;
            border-radius: 8px;
        }

        th {
            background: #667eea;
            color: #ffffff;
            font-weight: 600;
            padding: 14px 16px;
            font-size: 14px;
            border: 1px solid #5a71db;
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            color: #4a5568;
            border: 1px solid #edf2f7;
            vertical-align: middle;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tbody tr:hover {
            background-color: #edf2f7;
            transition: background-color 0.2s ease;
        }

        ul {
            margin: 0;
            padding-left: 18px;
        }

        ul li {
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 2px;
        }
    </style>
</head>

<body>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th rowspan="2">Kategori</th>
                    <th colspan="2">Rincian Produk</th>
                </tr>
                <tr>
                    <th>Nama Item</th>
                    <th>Spesifikasi</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2"><strong>Perangkat Keras</strong></td>
                    <td>Monitor LED</td>
                    <td>24 Inci, Full HD</td>
                </tr>
                <tr>
                    <td>Keyboard Mekanik</td>
                    <td>
                        <ul>
                            <li>Switch Biru</li>
                            <li>Lampu RGB</li>
                        </ul>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>

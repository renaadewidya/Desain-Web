<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementasi Video di HTML</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 15px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }

        .video-wrapper video,
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Integrasi Pemutar Video Native</h2>
        <div class="video-wrapper">
            <video controls poster="sampul.jpg" playsinline>
                <source src="video-edukasi.mp4" type="video/mp4" />
                <source src="video-edukasi.webm" type="video/webm" />
                <track src="teks-id.vtt" kind="subtitles" srclang="id" label="Bahasa Indonesia" default />
                Peramban Anda tidak mendukung elemen video HTML5.
            </video>
        </div>
    </div>

    <div class="container">
        <h2>Embed Video Eksternal (YouTube) - Hindia</h2>
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/lB8ASupNtlw" title="Hindia - everything u are"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <title>Implementasi Audio di HTML</title>
</head>

<body>
    <h2>Pemutar Audio Standar</h2>
    <audio controls>
        <source src="musik-santai.mp3" type="audio/mpeg">
        <source src="musik-santai.ogg" type="audio/ogg">
        Peramban Anda tidak mendukung elemen audio HTML5.
    </audio>

    <h2>Audio dengan Autoplay &amp; Loop</h2>
    <audio autoplay loop muted>
        <source src="background-music.mp3" type="audio/mpeg">
    </audio>
</body>

</html>
